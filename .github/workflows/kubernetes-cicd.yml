name: Student Result ML - Kubernetes CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: abhireddy28/student-result-ml

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create immutable image reference
        id: image
        run: |
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Build Docker image for testing
        run: docker build -t student-result-ml:test .

      - name: Start test container
        run: |
          docker run -d --name student-result-test -p 5000:5000 student-result-ml:test

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/; then
              echo "Container health test passed"
              exit 0
            fi
            echo "Waiting... attempt $i"
            sleep 2
          done
          docker logs student-result-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested image
        run: |
          docker tag student-result-ml:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker tag student-result-ml:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push tested image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-kubernetes:
    needs: build-test-push
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Show current deployment image
        run: |
          kubectl get deployment student-result-ml -o jsonpath="{.spec.template.spec.containers[0].image}"
          echo ""

      - name: Deploy the tested image
        run: |
          kubectl set image deployment/student-result-ml student-result-api=${{ needs.build-test-push.outputs.image_ref }}

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/student-result-ml --timeout=180s

      - name: Verify health
        run: |
          kubectl exec deploy/student-result-ml -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:5000/', timeout=10).read().decode())"

      - name: Show final status
        run: |
          kubectl get deployment student-result-ml -o wide
          kubectl get pods -o wide

      - name: Roll back if verification fails
        if: failure()
        run: |
          kubectl rollout undo deployment/student-result-ml
          kubectl rollout status deployment/student-result-ml --timeout=180s
